<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenlik Ekranı — Giriş</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #e6e6e6;
         font-family: -apple-system, Segoe UI, Arial, sans-serif; }
  form { background: #14171c; border: 1px solid #262b33; border-radius: 14px; padding: 32px; width: min(380px, 90vw);
         display: grid; gap: 16px; text-align: center; }
  h1 { margin: 0; font-size: 24px; }
  .hata { background: #4a0010; color: #ffd0d8; padding: 10px; border-radius: 8px; font-size: 18px; }
  input { font-size: 22px; padding: 14px; border-radius: 10px; border: 1px solid #39404b; background: #0b0d10; color: #fff; }
  button { font-size: 22px; font-weight: 700; padding: 16px; border: 0; border-radius: 10px; background: #1b7a35; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<form method="post" action="/guvenlik/giris">
  <h1>🛡 Güvenlik Ekranı</h1>
  {% if hata %}<div class="hata">{{ hata }}</div>{% endif %}
  <input type="password" name="sifre" placeholder="Güvenlik şifresi" autofocus required>
  <button type="submit">Giriş</button>
</form>
</body>
</html>
