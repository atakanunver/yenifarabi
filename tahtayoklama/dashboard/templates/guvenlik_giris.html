<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenlik Ekranı — Giriş</title>
<link rel="stylesheet" href="/static/cam-tema.css?v=20261115b">
<style>
  body { display: grid; place-items: center; }
  form { width: min(380px, 90vw); display: grid; gap: 16px; text-align: center; padding: 32px; }
  h1 { font-size: 24px; }
  .hata { background: rgba(255, 59, 92, 0.25); border: 1px solid rgba(255, 59, 92, 0.6); color: #fff; padding: 10px; border-radius: 14px; font-size: 18px; }
  input, button { font-size: 22px; padding: 14px; min-height: 56px; }
  button { font-weight: 700; }
</style>
</head>
<body class="cam-sayfa">
<div class="cam-ortam" aria-hidden="true"></div>
<form method="post" action="/guvenlik/giris" class="cam-pencere">
  <h1 class="cam-baslik">🛡 Güvenlik Ekranı</h1>
  {% if hata %}<div class="hata">{{ hata }}</div>{% endif %}
  <input class="cam-girdi" type="password" name="sifre" placeholder="Güvenlik şifresi" autofocus required>
  <button type="submit" class="cam-dugme">Giriş</button>
</form>
</body>
</html>
