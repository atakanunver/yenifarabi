<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP Kameralar (yedek) — Yoklama ve Yönetim Paneli</title>
<link rel="stylesheet" href="/static/cam-tema.css?v=20261115c">
<style>
  * { box-sizing: border-box; }
  body { height: 100vh; display: flex; flex-direction: column; gap: 8px; padding: 8px; overflow: hidden; }
  header { min-height: 52px; flex-shrink: 0; }
  header a.geri { color: var(--color-cam-metin-2); text-decoration: none; font-size: 14px; }
  header a.geri:hover { color: var(--color-cam-metin); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header span { font-size: 13px; color: var(--color-cam-metin-3); }
  #grid {
    flex: 1; display: grid; gap: 6px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    min-height: 0;
  }
  .tile {
    position: relative; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--color-cam-kenar);
    border-radius: 14px; overflow: hidden; cursor: zoom-in;
    user-select: none; -webkit-user-select: none;
  }
  .tile iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .tile .label {
    position: absolute; left: 0; top: 0; z-index: 2;
    background: rgba(5, 8, 22, 0.6); color: #fff; font-size: 13px; font-weight: 600;
    padding: 3px 9px; border-bottom-right-radius: 12px;
  }
  .tile.enlarged {
    position: fixed; inset: 68px 8px 8px 8px; z-index: 10;
    grid-column: auto; grid-row: auto; cursor: zoom-out;
  }
  #grid.has-enlarged .tile:not(.enlarged) { display: none; }
  .hint { font-size: 12px; color: var(--color-cam-metin-3); margin-left: auto; }
</style>
</head>
<body class="cam-sayfa">
<div class="cam-ortam" aria-hidden="true"></div>
<header class="cam-serit">
  <a class="geri" href="/">← Panele dön</a>
  <h1>🎥 IP Kameralar <span style="color:#d9a441;font-weight:400;">(yedek — DVR arızalanırsa)</span></h1>
  <span id="status">yükleniyor…</span>
  <a class="geri" href="/kameralar">← DVR Kameralar</a>
  <a class="geri" href="/kameralar-kayit">📼 Hareketli Kayıtlar →</a>
  <span class="hint">Büyütmek/küçültmek için bir kareye çift tıkla</span>
</header>
<div id="grid"></div>

<script>
// Not (2026-10-16): bagimsiz IP kameralar - DVR (.99) arizalanirsa yedek olarak
// burada duruyor. Ayni fiziksel kameralarin DVR'daki kopyasi /kameralar sayfasinda
// (kalite orada biraz daha iyi, bu yuzden o ana sayfa).
// wc_girisi/rsvideo_250: kullanici verdi (2026-10-16), DIS1/D11'in IP eslenigi
// olup olmadigi netlesmedi - etiketler yanlissa duzeltilmeli.
const CAMERAS = [
  { name: "giris_ip",         label: "Giriş" },
  { name: "onbahce_ip",       label: "Ön Bahçe" },
  { name: "altkoridor_ip",    label: "Alt Koridor" },
  { name: "ustkoridor_ip",    label: "Üst Koridor" },
  { name: "ogretmenler_ip",   label: "Öğretmenler" },
  { name: "arkataraf",        label: "Yan Bahçe / Arka Taraf" },
  { name: "disbina_kaliteli", label: "Dış Bina Girişi" },
  { name: "wc_girisi",        label: "WC Girişi" },
  { name: "rsvideo_250",      label: "Dış Bina (.252)" },
];

// Not: Chrome'da .local (mDNS) adları bazen cozulmuyor/gecikiyor (bilinen sorun,
// 2026-10-15). Bu yuzden hostname yerine sabit IP kullaniliyor - dashboard hangi
// adresten acilirsa acilsin kameralar hep IP uzerinden baglanir.
const MEDIAMTX_WEBRTC = `http://${location.hostname}:8889`;
const grid = document.getElementById("grid");
document.getElementById("status").textContent = CAMERAS.length + " kamera";

for (const cam of CAMERAS) {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.dataset.name = cam.name;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = cam.label;

  const iframe = document.createElement("iframe");
  iframe.src = `${MEDIAMTX_WEBRTC}/${cam.name}/`;
  iframe.allow = "autoplay";

  tile.appendChild(iframe);
  tile.appendChild(label);
  tile.addEventListener("mousedown", (e) => { if (e.detail > 1) e.preventDefault(); });
  tile.addEventListener("dblclick", () => {
    window.getSelection()?.removeAllRanges();
    const isEnlarged = tile.classList.contains("enlarged");
    document.querySelectorAll(".tile.enlarged").forEach(t => t.classList.remove("enlarged"));
    grid.classList.remove("has-enlarged");
    if (!isEnlarged) {
      tile.classList.add("enlarged");
      grid.classList.add("has-enlarged");
    }
  });
  grid.appendChild(tile);
}
</script>
</body>
</html>
