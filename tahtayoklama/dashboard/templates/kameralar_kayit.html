<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Harekete Duyarlı Kamera Kayıtları — Yoklama ve Yönetim Paneli</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0d10; color: #e6e6e6;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 8px 14px; background: #14171c; border-bottom: 1px solid #262b33;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  header a.geri { color: #9aa3b2; text-decoration: none; font-size: 13px; }
  header a.geri:hover { color: #e6e6e6; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: #cfd3da; }
  .rozet {
    font-size: 11px; background: rgba(34,197,94,.15); color: #4ade80;
    padding: 3px 8px; border-radius: 12px; border: 1px solid rgba(34,197,94,.3);
  }
  .govde {
    flex: 1; display: grid; grid-template-columns: 330px 1fr; min-height: 0;
  }
  @media (max-width: 860px) {
    .govde { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
  }
  .sol {
    background: #12151a; border-right: 1px solid #222730;
    display: flex; flex-direction: column; min-height: 0;
  }
  .filtreler {
    padding: 12px; border-bottom: 1px solid #222730; display: flex; flex-direction: column; gap: 8px;
  }
  label { font-size: 11px; color: #8c95a6; text-transform: uppercase; letter-spacing: .04em; }
  select {
    width: 100%; padding: 7px 9px; background: #0b0d10; color: #e6e6e6;
    border: 1px solid #2b313c; border-radius: 6px; font-size: 13px;
  }
  .saat-chipler {
    display: flex; gap: 4px; flex-wrap: wrap; padding-top: 4px; max-height: 68px; overflow-y: auto;
  }
  .chip {
    background: #1a1f27; color: #9aa3b2; border: 1px solid #282f3b;
    border-radius: 4px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .chip.aktif { background: #2563eb; color: #fff; border-color: #3b82f6; }
  .liste-baslik {
    padding: 8px 12px; font-size: 12px; color: #8c95a6; border-bottom: 1px solid #1d222a;
    display: flex; justify-content: space-between; align-items: center;
  }
  #kayit-listesi {
    flex: 1; overflow-y: auto; padding: 6px;
  }
  .kayit-oge {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
    border: 1px solid transparent; margin-bottom: 3px;
  }
  .kayit-oge:hover { background: #1a1f28; }
  .kayit-oge.secili { background: #1e3a8a; border-color: #3b82f6; color: #fff; }
  .kayit-oge .boyut { font-size: 11px; color: #7f8899; }
  .kayit-oge.secili .boyut { color: #bfdbfe; }
  .sag {
    display: flex; flex-direction: column; background: #07080a; min-height: 0;
  }
  .oynatici-ust {
    padding: 10px 16px; background: #101318; border-bottom: 1px solid #222730;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .oynatici-baslik { font-size: 14px; font-weight: 600; color: #e2e8f0; }
  .oynatici-kontroller { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9aa3b2; }
  .btn {
    background: #1e2430; color: #e2e8f0; border: 1px solid #2e3646;
    border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: #283040; }
  .btn.aktif { background: #2563eb; border-color: #3b82f6; color: #fff; }
  .video-kapsayici {
    flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative;
  }
  video { width: 100%; height: 100%; max-height: 100%; background: #000; outline: none; }
  #yukleniyor {
    position: absolute; background: rgba(15,23,42,.88); color: #e2e8f0;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; border: 1px solid #334155;
    display: none; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <a class="geri" href="/">← Panele dön</a>
  <h1>📼 Harekete Duyarlı Kamera Kayıtları</h1>
  <span class="rozet">Yalnız hareket algılanan dakikalar saklanır (10 gün)</span>
  <a class="geri" style="margin-left:auto" href="/kameralar">🎥 Canlı DVR Kameralar →</a>
  <a class="geri" href="/kameralar-ip">IP Kameralar →</a>
</header>

<div class="govde">
  <div class="sol">
    <div class="filtreler">
      <div>
        <label for="kamera-sec">Kamera</label>
        <select id="kamera-sec"></select>
      </div>
      <div>
        <label for="tarih-sec">Tarih</label>
        <select id="tarih-sec"></select>
      </div>
      <div>
        <label>Saat Filtresi</label>
        <div class="saat-chipler" id="saat-chipler"></div>
      </div>
    </div>
    <div class="liste-baslik">
      <span id="kayit-sayac">Yükleniyor…</span>
      <label style="text-transform:none;cursor:pointer;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="oto-ileri" checked> Arka arkaya oynat
      </label>
    </div>
    <div id="kayit-listesi"></div>
  </div>

  <div class="sag">
    <div class="oynatici-ust">
      <div class="oynatici-baslik" id="aktif-baslik">Soldan bir hareket kaydı seçin</div>
      <div class="oynatici-kontroller">
        <button class="btn" onclick="oncekiKayit()">⏮ Önceki</button>
        <button class="btn" onclick="sonrakiKayit()">⏭ Sonraki</button>
        <span>Hız:</span>
        <button class="btn aktif" data-hiz="1" onclick="hizAyarla(1, this)">1x</button>
        <button class="btn" data-hiz="2" onclick="hizAyarla(2, this)">2x</button>
        <button class="btn" data-hiz="4" onclick="hizAyarla(4, this)">4x</button>
        <a class="btn" id="indir-link" href="#" download style="display:none">⬇ İndir</a>
      </div>
    </div>
    <div class="video-kapsayici">
      <video id="oynatici" controls playsinline></video>
      <div id="yukleniyor">⏳ Video hazırlanıyor…</div>
    </div>
  </div>
</div>

<script>
const kameraSec = document.getElementById("kamera-sec");
const tarihSec = document.getElementById("tarih-sec");
const saatChipler = document.getElementById("saat-chipler");
const kayitListesi = document.getElementById("kayit-listesi");
const kayitSayac = document.getElementById("kayit-sayac");
const oynatici = document.getElementById("oynatici");
const aktifBaslik = document.getElementById("aktif-baslik");
const indirLink = document.getElementById("indir-link");
const yukleniyor = document.getElementById("yukleniyor");

let tumKayitlar = [];
let filtrelenmis = [];
let seciliSaat = "";
let aktifIndeks = -1;
let seciliHiz = 1;

// SMS bağlantısı: ?kamera=...&tarih=...&dosya=... → doğrudan o parçayı aç
const URL_PARAM = new URLSearchParams(location.search);
let hedefDosya = URL_PARAM.get("dosya");

async function verileriYukle(kamera = URL_PARAM.get("kamera") || "", tarih = URL_PARAM.get("tarih") || "") {
  URL_PARAM.delete("kamera"); URL_PARAM.delete("tarih");
  const params = new URLSearchParams();
  if (kamera) params.set("kamera", kamera);
  if (tarih) params.set("tarih", tarih);
  const r = await fetch("/api/kameralar/kayitlar?" + params.toString());
  if (r.status === 401) { location.href = "/giris"; return; }
  const d = await r.json();

  kameraSec.innerHTML = d.kameralar.map(k =>
    `<option value="${k.id}" ${k.id === d.secili_kamera ? "selected" : ""}>${k.ad}</option>`
  ).join("");

  tarihSec.innerHTML = d.gunler.map(g =>
    `<option value="${g}" ${g === d.secili_tarih ? "selected" : ""}>${g}</option>`
  ).join("");

  tumKayitlar = d.kayitlar || [];
  seciliSaat = "";
  saatChipleriniOlustur();
  listeyiCiz();
  if (filtrelenmis.length > 0) {
    const hi = hedefDosya ? filtrelenmis.findIndex(k => k.dosya === hedefDosya) : -1;
    hedefDosya = null;
    kayitOynat(hi >= 0 ? hi : 0);
  } else {
    aktifBaslik.textContent = "Bu tarihte hareket kaydı yok";
    oynatici.removeAttribute("src");
    indirLink.style.display = "none";
  }
}

function saatChipleriniOlustur() {
  const saatler = [...new Set(tumKayitlar.map(k => k.saat_grup))].sort();
  let html = `<button class="chip ${seciliSaat === "" ? "aktif" : ""}" onclick="saatSec('')">Tümü (${tumKayitlar.length})</button>`;
  for (const s of saatler) {
    const adet = tumKayitlar.filter(k => k.saat_grup === s).length;
    html += `<button class="chip ${seciliSaat === s ? "aktif" : ""}" onclick="saatSec('${s}')">${s}:00 (${adet})</button>`;
  }
  saatChipler.innerHTML = html;
}

function saatSec(s) {
  seciliSaat = s;
  saatChipleriniOlustur();
  listeyiCiz();
}

function listeyiCiz() {
  filtrelenmis = seciliSaat ? tumKayitlar.filter(k => k.saat_grup === seciliSaat) : tumKayitlar;
  kayitSayac.textContent = `${filtrelenmis.length} hareketli dakika`;
  kayitListesi.innerHTML = filtrelenmis.map((k, idx) => `
    <div class="kayit-oge ${idx === aktifIndeks ? "secili" : ""}" data-idx="${idx}" onclick="kayitOynat(${idx})">
      <span>🕒 ${k.saat}</span>
      <span class="boyut">${k.boyut_mb} MB</span>
    </div>
  `).join("");
}

function kayitOynat(idx) {
  if (idx < 0 || idx >= filtrelenmis.length) return;
  aktifIndeks = idx;
  document.querySelectorAll(".kayit-oge").forEach((el, i) => {
    el.classList.toggle("secili", i === idx);
    if (i === idx) el.scrollIntoView({ block: "nearest" });
  });
  const k = filtrelenmis[idx];
  const camId = kameraSec.value;
  const camAd = kameraSec.options[kameraSec.selectedIndex]?.text || camId;
  const tarih = tarihSec.value;
  const url = `/api/kameralar/video/${encodeURIComponent(camId)}/${encodeURIComponent(k.dosya)}`;

  aktifBaslik.textContent = `${camAd} — ${tarih} ${k.saat} (${k.boyut_mb} MB)`;
  yukleniyor.style.display = "block";
  oynatici.src = url;
  oynatici.playbackRate = seciliHiz;
  oynatici.play().catch(() => {});
  indirLink.href = url;
  indirLink.download = `${camId}_${k.dosya}`;
  indirLink.style.display = "inline-block";
}

oynatici.addEventListener("loadeddata", () => {
  yukleniyor.style.display = "none";
  oynatici.playbackRate = seciliHiz;
});
oynatici.addEventListener("playing", () => { yukleniyor.style.display = "none"; });
oynatici.addEventListener("waiting", () => { yukleniyor.style.display = "block"; });
oynatici.addEventListener("ended", () => {
  if (document.getElementById("oto-ileri").checked) {
    // Liste yeniden eskiye sıralı olduğu için kronolojik sonraki kayıt bir üst satırdır (idx - 1)
    if (aktifIndeks > 0) kayitOynat(aktifIndeks - 1);
  }
});

function oncekiKayit() {
  if (aktifIndeks + 1 < filtrelenmis.length) kayitOynat(aktifIndeks + 1);
}
function sonrakiKayit() {
  if (aktifIndeks > 0) kayitOynat(aktifIndeks - 1);
}
function hizAyarla(h, btn) {
  seciliHiz = h;
  oynatici.playbackRate = h;
  document.querySelectorAll("[data-hiz]").forEach(b => b.classList.remove("aktif"));
  btn.classList.add("aktif");
}

kameraSec.addEventListener("change", () => verileriYukle(kameraSec.value, tarihSec.value));
tarihSec.addEventListener("change", () => verileriYukle(kameraSec.value, tarihSec.value));

verileriYukle();
</script>
</body>
</html>
