<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenlik Ekranı</title>
<link rel="stylesheet" href="/static/cam-tema.css?v=20261115c">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; padding: 8px; gap: 8px;
         display: grid; grid-template-columns: 1fr 320px; user-select: none; -webkit-user-select: none; }

  /* Kameralar */
  #grid { display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(3, 1fr); min-height: 0; min-width: 0; }
  .kare { position: relative; background: rgba(255, 255, 255, 0.04); border: 3px solid rgba(255, 255, 255, 0.2); border-radius: 16px; overflow: hidden; cursor: zoom-in; }
  .kare iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .kare .ad { position: absolute; left: 0; top: 0; z-index: 2; background: rgba(5, 8, 22, 0.6); color: #fff;
              font-size: 15px; font-weight: 600; padding: 3px 10px; border-bottom-right-radius: 12px; }
  .kare .rozet { position: absolute; right: 0; top: 0; z-index: 2; font-size: 13px; font-weight: 700; padding: 3px 10px;
                 border-bottom-left-radius: 12px; display: none; }
  .kare.yedek .rozet { display: block; background: rgba(255, 179, 0, 0.9); color: rgb(20 20 30); }
  .kare .yok { position: absolute; inset: 0; z-index: 3; display: none; place-items: center; background: rgba(5, 8, 22, 0.8);
               color: #ff8a8a; font-size: 20px; font-weight: 800; }
  .kare.baglanti-yok .yok { display: grid; }
  .kare.hareket { border-color: #ff1744; animation: hareket 0.8s infinite; }
  @keyframes hareket { 50% { border-color: #4a0010; } }
  .kare.buyuk { position: fixed; inset: 8px 336px 8px 8px; z-index: 10; cursor: zoom-out; }
  #grid.buyutuldu .kare:not(.buyuk) { visibility: hidden; }

  /* Sağ panel */
  aside { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow-y: auto; }
  #saat { font-size: 30px; font-weight: 700; text-align: center; line-height: 1.1; }
  #tarih { font-size: 14px; color: var(--color-cam-metin-2); text-align: center; }
  #durum { font-size: 18px; font-weight: 800; text-align: center; padding: 10px; border-radius: 14px;
           background: rgba(50, 215, 75, 0.28); border: 1px solid rgba(50, 215, 75, 0.6); color: #fff; }
  #durum.aktif { background: rgba(255, 59, 92, 0.6); border-color: rgba(255, 59, 92, 0.9); animation: yanip 1.2s infinite; }
  #durum.bilinmiyor { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
  @keyframes yanip { 50% { opacity: .7; } }
  h2 { font-size: 13px; letter-spacing: .08em; color: var(--color-cam-metin-3); margin: 4px 0 0; }
  .dugme { border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 14px; color: #fff; font-weight: 800; cursor: pointer; width: 100%;
           font-family: inherit; background: rgba(255, 255, 255, 0.14); transition: background 0.15s, transform 0.12s; }
  .dugme:hover { filter: brightness(1.2); }
  .dugme:active { transform: scale(0.98); }
  .dugme:disabled { opacity: .5; cursor: not-allowed; }
  .alarm { font-size: 19px; min-height: 52px; }
  .haber { font-size: 15px; min-height: 40px; background: rgba(56, 189, 248, 0.2); text-align: left; padding: 0 14px; }
  #iptal { font-size: 18px; min-height: 60px; background: rgba(255, 179, 0, 0.9); color: rgb(20 20 30); display: none; }
  #durum.aktif + #iptal { display: block; }
  #hareket-modu { font-size: 15px; min-height: 40px; }
  #hareket-modu.acik { background: rgba(255, 59, 92, 0.55); border-color: rgba(255, 59, 92, 0.9); }
  #kilitle { font-size: 15px; min-height: 40px; }
  .bosluk { flex: 1; }
  .telefon { font-size: 15px; color: var(--color-cam-metin-2); display: flex; justify-content: space-between; }
  .telefon b { font-size: 18px; color: #fff; }
  #sonuc { font-size: 15px; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); display: none; }

  /* Onay penceresi */
  #onay { position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 22, 0.8); display: none; place-items: center; }
  #onay.acik { display: grid; }
  #onay .kutu { background: var(--color-cam-panel); width: min(720px, 92vw); text-align: center; }
  #onay h3 { font-size: 34px; margin: 0 0 8px; }
  #onay p { font-size: 18px; color: var(--color-cam-metin-2); margin: 0 0 24px; }
  #onay .secenekler { display: grid; gap: 14px; }
  #onay .secenekler button { font-size: 26px; min-height: 78px; }
  #onay .vazgec { background: rgba(255, 255, 255, 0.16); }
  #nobetci-popup { border: 2px solid #f5c542; border-radius: 28px; background: var(--color-cam-panel); color: #fff; width: min(680px, 90vw); padding: 34px; text-align: center; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
                   -webkit-backdrop-filter: blur(40px) saturate(150%); backdrop-filter: blur(40px) saturate(150%); }
  #nobetci-popup::backdrop { background: rgba(5, 8, 22, 0.7); }
  #nobetci-popup h2 { color: #f5c542; font-size: 25px; margin: 0 0 18px; letter-spacing: 0; }
  #nobetci-popup p { font-size: clamp(30px, 5vw, 52px); font-weight: 800; margin: 0 0 26px; }
  #nobetci-popup button { background: #f5c542; color: rgb(23 23 23); padding: 14px 32px; font-size: 19px; width: auto; }
  @media (prefers-reduced-motion: reduce) {
    .kare.hareket, #durum.aktif { animation: none; }
    .dugme { transition: none; }
  }
</style>
</head>
<body class="cam-sayfa">
<div class="cam-ortam" aria-hidden="true"></div>
<div id="grid"></div>

<aside class="cam-pencere">
  <div id="saat">--:--</div>
  <div id="tarih"></div>
  <div id="durum" class="bilinmiyor">Durum alınıyor…</div>
  <button type="button" class="dugme" id="iptal">YANLIŞ ALARM — İPTAL</button>

  <h2>ACİL ALARM</h2>
  {% for anahtar, t in alarmlar.items() %}
  <button type="button" class="dugme alarm" style="background: {{ t.renk }}" data-tur="{{ anahtar }}" data-ad="{{ t.baslik }}">{{ t.baslik }}</button>
  {% endfor %}

  <h2>YÖNETİME HABER VER</h2>
  {% for anahtar, ad in nedenler.items() %}
  <button type="button" class="dugme haber" data-neden="{{ anahtar }}" data-ad="{{ ad }}">{{ ad }}</button>
  {% endfor %}

  <div id="sonuc"></div>
  <div class="bosluk"></div>
  <button type="button" class="dugme" id="hareket-modu">HAREKET MODU: KAPALI</button>
  <form method="post" action="/guvenlik/cikis"><button type="submit" class="dugme" id="kilitle">🔒 KİLİTLE</button></form>
  {% for t in telefonlar %}<div class="telefon"><span>{{ t.ad }}</span><b>{{ t.no }}</b></div>{% endfor %}
</aside>

<div id="onay" role="dialog" aria-modal="true">
  <div class="kutu cam-dialog">
    <h3 id="onay-baslik"></h3>
    <p id="onay-metin"></p>
    <div class="secenekler" id="onay-secenekler"></div>
  </div>
</div>
<dialog id="nobetci-popup" aria-labelledby="nobetci-baslik">
  <h2 id="nobetci-baslik">NÖBETÇİ ÇAĞRISI</h2>
  <p id="nobetci-mesaj"></p>
  <button type="button" class="dugme" id="nobetci-kapat">TAMAM</button>
</dialog>

<script>
// Yan Bahçe için canlı görüntü kontrolünde DVR channel=7 Öğretmenler,
// .100 IP akışı Yan Bahçe çıktı (2026-11-02). Bu kutu doğrudan .100'ü kullanır.
// Diğer kameralar DVR ana kaynak; hazır değilse aynı fiziksel IP akışına geçer.
const KAMERALAR = [
  { dvr: "giris_dvr",       ip: "giris_ip",         ad: "Giriş" },
  { dvr: "onbahce_dvr",     ip: "onbahce_ip",       ad: "Ön Bahçe" },
  { dvr: "altkoridor_dvr",  ip: "altkoridor_ip",    ad: "Alt Koridor" },
  { dvr: "ustkoridor_dvr",  ip: "ustkoridor_ip",    ad: "Üst Koridor" },
  { dvr: "ogretmenler_dvr", ip: "ogretmenler_ip",   ad: "Öğretmenler" },
  { dvr: "arkataraf",       ip: null,                ad: "Yan Bahçe" },
  { dvr: "wc_girisi",       ip: null,                ad: "WC Girişi" },
  { dvr: "dis1_dvr",        ip: "rsvideo_250",      ad: "Dış 1" },  // .250 = DIS1 (2026-10-18 görüntüyle doğrulandı)
  { dvr: "dis2_dvr",        ip: "disbina_kaliteli", ad: "Dış 2" },
];
// kameralar.html ile aynı: .local adı Chrome'da bazen çözülmüyor, sabit IP.
const MEDIAMTX_WEBRTC = "http://" + location.hostname + ":8889";
const HAREKET_SN = 10;
const $ = id => document.getElementById(id);
const grid = $("grid");

function sakla(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function oku(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// --- Kareler ---------------------------------------------------------------
for (const k of KAMERALAR) {
  const kare = document.createElement("div");
  kare.className = "kare";
  kare.innerHTML = '<div class="ad"></div><div class="rozet">YEDEK</div><div class="yok">BAĞLANTI YOK</div>';
  kare.querySelector(".ad").textContent = k.ad;
  k.iframe = document.createElement("iframe");
  k.iframe.allow = "autoplay";
  kare.prepend(k.iframe);
  k.kare = kare;
  k.kaynak = null;
  k.bekleyen = null; k.sayac = 0;
  k.kayip = false; k.iyilesmeSayac = 0;
  kaynakAta(k, k.dvr);
  kare.addEventListener("click", () => {
    const buyuk = kare.classList.contains("buyuk");
    document.querySelectorAll(".kare.buyuk").forEach(x => x.classList.remove("buyuk"));
    grid.classList.toggle("buyutuldu", !buyuk);
    if (!buyuk) kare.classList.add("buyuk");
  });
  grid.appendChild(kare);
}

function kaynakAta(k, yol) {
  if (k.kaynak === yol) return;
  k.kaynak = yol;
  k.iframe.src = `${MEDIAMTX_WEBRTC}/${yol}/`;
  k.kare.classList.toggle("yedek", yol !== k.dvr);
}

function kaynakYenile(k, yol) {
  k.iframe.src = "about:blank";
  setTimeout(() => {
    if (k.kaynak === yol && !k.kayip) k.iframe.src = `${MEDIAMTX_WEBRTC}/${yol}/`;
  }, 250);
}

// Titremeyi önlemek için kaynak değişikliği art arda 2 yoklamada aynı çıkarsa uygulanır.
function kameralariGuncelle(hazir) {
  if (!hazir) return;  // mediamtx API'si yoksa dokunma
  for (const k of KAMERALAR) {
    let hedef = k.dvr, yok = false;
    if (!hazir[k.dvr]) {
      if (k.ip && hazir[k.ip]) hedef = k.ip; else yok = true;
    }
    k.kare.classList.toggle("baglanti-yok", yok);
    if (hedef === k.kaynak) {
      k.bekleyen = null; k.sayac = 0;
      if (yok) {
        k.kayip = true;
        k.iyilesmeSayac = 0;
      } else if (k.kayip && ++k.iyilesmeSayac >= 2) {
        k.kayip = false;
        k.iyilesmeSayac = 0;
        kaynakYenile(k, hedef);
      }
      continue;
    }
    if (k.bekleyen === hedef) k.sayac++; else { k.bekleyen = hedef; k.sayac = 1; }
    if (k.sayac >= 2) {
      kaynakAta(k, hedef);
      k.kayip = yok;
      k.iyilesmeSayac = 0;
      k.bekleyen = null;
      k.sayac = 0;
    }
  }
}

// --- Hareket modu ----------------------------------------------------------
let hareketModu = oku("guvenlik_hareket_modu") === "1";
let sonBip = 0, sesBaglam = null;
function hareketDugmesi() {
  const d = $("hareket-modu");
  d.classList.toggle("acik", hareketModu);
  d.textContent = "HAREKET MODU: " + (hareketModu ? "AÇIK" : "KAPALI");
  if (!hareketModu) KAMERALAR.forEach(k => k.kare.classList.remove("hareket"));
}
$("hareket-modu").addEventListener("click", () => {
  hareketModu = !hareketModu;
  sakla("guvenlik_hareket_modu", hareketModu ? "1" : "0");
  hareketDugmesi();
});
hareketDugmesi();

function bip() {
  const simdi = Date.now();
  if (simdi - sonBip < 5000) return;
  sonBip = simdi;
  try {
    sesBaglam = sesBaglam || new AudioContext();
    const o = sesBaglam.createOscillator(), g = sesBaglam.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g); g.connect(sesBaglam.destination);
    o.start(); o.stop(sesBaglam.currentTime + 0.25);
  } catch (e) {}
}

const nobetciPopup = $("nobetci-popup");
const NOBETCI_SESLERI = {
  "Nöbetçi Müdür Odasına Gidin Lütfen": "nobetci-mudur.wav",
  "Nöbetçi Müdür Yardımcısı Odasına Gidin Lütfen": "nobetci-yardimci.wav",
};
$("nobetci-kapat").addEventListener("click", () => nobetciPopup.close());
let sonNobetciCagrisi = Number(oku("guvenlik_son_nobetci_cagrisi") || 0);
function nobetciCagrisiGoster(cagri) {
  if (!cagri || Number(cagri.id) <= sonNobetciCagrisi) return;
  sonNobetciCagrisi = Number(cagri.id);
  sakla("guvenlik_son_nobetci_cagrisi", String(sonNobetciCagrisi));
  $("nobetci-mesaj").textContent = cagri.mesaj;
  nobetciPopup.showModal();
  bip();
  const kayit = NOBETCI_SESLERI[cagri.mesaj];
  if (kayit) {
    // Bilgehan TTS ile bir kez üretilmiş kayıt (static/ses/)
    new Audio("/static/ses/" + kayit).play().catch(() => {});
  } else if ("speechSynthesis" in window) {
    const ses = new SpeechSynthesisUtterance(cagri.mesaj);
    ses.lang = "tr-TR";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(ses);
  }
}

function hareketGuncelle(hareket, simdi) {
  if (!hareketModu) return;
  let yeni = false;
  for (const k of KAMERALAR) {
    const son = Math.max(hareket[k.dvr] || 0, (k.ip && hareket[k.ip]) || 0);
    const var_ = simdi - son < HAREKET_SN;
    if (var_ && !k.kare.classList.contains("hareket")) yeni = true;
    k.kare.classList.toggle("hareket", var_);
  }
  if (yeni) bip();
}

// --- Saat ve durum ---------------------------------------------------------
function saatYaz() {
  const d = new Date();
  $("saat").textContent = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  $("tarih").textContent = d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
}
saatYaz(); setInterval(saatYaz, 1000);

async function istek(url, govde) {
  const r = await fetch(url, govde === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(govde) });
  if (r.status === 401) { location.href = "/guvenlik/giris"; throw new Error("Oturum yok"); }
  if (!r.ok) {
    let mesaj = r.status + "";
    try { mesaj = (await r.json()).detail || mesaj; } catch (e) {}
    throw new Error(mesaj);
  }
  return r.json();
}

async function yenile() {
  try {
    const d = await istek("/api/guvenlik/durum");
    const kutu = $("durum");
    kutu.classList.remove("bilinmiyor");
    kutu.classList.toggle("aktif", !!d.aktif);
    kutu.textContent = d.aktif
      ? "⚠ " + d.aktif.baslik + (d.aktif.tatbikat ? " (TATBİKAT)" : "") + " — " + (d.aktif.zaman || "").slice(11, 16)
      : "● NORMAL";
    kameralariGuncelle(d.kameralar);
    hareketGuncelle(d.hareket || {}, d.simdi);
    nobetciCagrisiGoster(d.nobetci_cagrisi);
  } catch (e) {
    $("durum").className = "bilinmiyor";
    $("durum").textContent = "Sunucuya ulaşılamıyor";
  }
}
yenile(); setInterval(yenile, 3000);

// --- Onay penceresi ----------------------------------------------------------
let mesgul = false;
function onayAc(baslik, metin, secenekler) {
  $("onay-baslik").textContent = baslik;
  $("onay-metin").textContent = metin;
  const kutu = $("onay-secenekler");
  kutu.replaceChildren();
  const vazgec = document.createElement("button");
  vazgec.type = "button"; vazgec.className = "dugme vazgec"; vazgec.textContent = "VAZGEÇ";
  vazgec.addEventListener("click", onayKapat);
  for (const s of secenekler) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "dugme"; b.textContent = s.yazi;
    b.style.background = s.renk; if (s.yaziRengi) b.style.color = s.yaziRengi;
    b.addEventListener("click", () => { onayKapat(); s.eylem(); });
    kutu.appendChild(b);
  }
  kutu.appendChild(vazgec);
  $("onay").classList.add("acik");
  vazgec.focus();  // Enter/Space yanlışlıkla alarm vermesin
}
function onayKapat() { $("onay").classList.remove("acik"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") onayKapat(); });

function sonucYaz(metin) {
  const s = $("sonuc");
  s.textContent = metin; s.style.display = "block";
  clearTimeout(sonucYaz.z); sonucYaz.z = setTimeout(() => { s.style.display = "none"; }, 20000);
}
function ozet(r) {
  const k = (r.kanallar || []).map(x => (x.basarili ? "✔ " : "✖ ") + x.kanal).join("  ");
  return r.tahta_toplam ? k + "  · Tahtalar " + r.tahta_basarili + "/" + r.tahta_toplam : k;
}
async function gonder(baslik, url, govde) {
  if (mesgul) return;
  mesgul = true;
  document.querySelectorAll("aside .dugme").forEach(b => b.disabled = true);
  sonucYaz(baslik + " — gönderiliyor…");
  try { sonucYaz(baslik + ": " + ozet(await istek(url, govde))); }
  catch (e) { sonucYaz(baslik + " — HATA: " + e.message); }
  document.querySelectorAll("aside .dugme").forEach(b => b.disabled = false);
  mesgul = false;
  yenile();
}

document.querySelectorAll(".alarm").forEach(d => d.addEventListener("click", () => {
  const ad = d.dataset.ad, tur = d.dataset.tur;
  onayAc(ad + " alarmı verilsin mi?", "Siren ve anons çalar, personele SMS gider, tahtalarda talimat ekranı açılır.", [
    { yazi: "GERÇEK OLAY — BAŞLAT", renk: "#b00020", eylem: () => gonder(ad + " (GERÇEK)", "/api/guvenlik/alarm", { tur, tatbikat: false }) },
    { yazi: "TATBİKAT", renk: "#ffb300", yaziRengi: "#111", eylem: () => gonder(ad + " (tatbikat)", "/api/guvenlik/alarm", { tur, tatbikat: true }) },
  ]);
}));
$("iptal").addEventListener("click", () => {
  onayAc("Yanlış alarm iptal edilsin mi?", "Ses durur, tahta ekranları kapanır, alarmı alanlara \"YANLIŞ ALARM\" SMS'i gider.", [
    { yazi: "EVET, İPTAL ET", renk: "#ffb300", yaziRengi: "#111", eylem: () => gonder("Yanlış alarm iptali", "/api/guvenlik/iptal", {}) },
  ]);
});
document.querySelectorAll(".haber").forEach(d => d.addEventListener("click", () => {
  onayAc("Yönetime bildirilsin mi?", "\"" + d.dataset.ad + "\" — yöneticilere SMS ve Telegram gider. Siren çalmaz.", [
    { yazi: "EVET, BİLDİR", renk: "#1565c0", eylem: () => gonder(d.dataset.ad, "/api/guvenlik/haber", { neden: d.dataset.neden }) },
  ]);
}));
</script>
</body>
</html>
