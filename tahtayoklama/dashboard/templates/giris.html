<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoklama ve Yönetim Paneli — Giriş</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tema.css?v={{ menu_agaci('/giris').surum }}">
<link rel="stylesheet" href="/static/pano.css?v={{ menu_agaci('/giris').surum }}">
<script>(function(){var t=null;try{t=localStorage.getItem('farabi_yoklama_tema')}catch(e){}if(t==='klasik'||t==='yumusak')t='argon';if(['argon','argon-koyu','koyu','black','material','material-koyu'].indexOf(t)<0)t=matchMedia('(prefers-color-scheme: dark)').matches?'argon-koyu':'argon';document.documentElement.dataset.tema=t})();</script>
</head>
<body class="giris-sarici">
{% include "_ikon_sprite.html" %}
<div class="tema-secici tema-secici-kose">
  <button type="button" data-tema="argon" title="Argon açık"><svg class="ikon"><use href="#ik-gunes"/></svg></button>
  <button type="button" data-tema="argon-koyu" title="Argon koyu"><svg class="ikon"><use href="#ik-ay"/></svg></button>
  <button type="button" data-tema="koyu" title="Taş Tahta"><svg class="ikon"><use href="#ik-tahta"/></svg></button>
</div>
<form method="post" action="/giris" class="giris-kart">
  <div class="giris-simge"><svg class="ikon ikon-buyuk"><use href="#ik-kilit"/></svg></div>
  <h1>Yoklama ve Yönetim Paneli</h1>
  {% if hata %}<div class="giris-hata">{{ hata }}</div>{% endif %}
  <input type="password" name="sifre" placeholder="Şifre" autofocus required>
  <button type="submit">Giriş yap</button>
</form>
<script src="/static/tema.js?v={{ menu_agaci('/giris').surum }}"></script>
</body>
</html>
