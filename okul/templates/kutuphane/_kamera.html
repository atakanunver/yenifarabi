{# Kamera bileşeni: görüntü tarayıcıda çözülür, sunucuya gönderilmez. Kamera açılmazsa elle giriş her zaman çalışır. #}
<div class="ktp-kamera" data-kamera>
  <div class="ktp-video" hidden><video playsinline muted autoplay></video><span class="ktp-cerceve" aria-hidden="true"></span></div>
  <div class="tuslar">
    <button type="button" class="tus" data-kamera-ac>📷 Kamerayı aç</button>
    <button type="button" class="tus ikincil" data-kamera-kapat hidden>Kapat</button>
    <select data-kamera-sec aria-label="Kamera seç" hidden></select>
    <button type="button" class="tus ikincil" data-foto>📸 Fotoğrafla oku</button>
    <input type="file" accept="image/*" capture="environment" data-foto-dosya hidden>
  </div>
  <p class="kucuk soluk" data-kamera-durum role="status"></p>
  <form class="ktp-elle" data-elle>
    <label>Elle gir (ISBN ya da etiketteki demirbaş no)
      <input name="kod" inputmode="numeric" autocomplete="off" maxlength="40" placeholder="ör. 9786052793978 ya da 03244"></label>
    <button class="tus ikincil">Bul</button>
  </form>
</div>
