{% extends "base.html" %}
{% block baslik %}Veli girişi — Dijital Okul{% endblock %}
{% block icerik %}
<div class="giris">
  <p class="baslik">Çocuğunuzun <span class="fosfor">okul günü.</span></p>
  <p class="soluk">Şifre yok: telefonunuza gelen kodla girin.</p>
  <div class="sekme-sec">
    <a href="/giris">Öğrenci / Öğretmen</a>
    <a href="/veli-giris" class="secili">Veli</a>
  </div>
  <div class="kart">
    {% if hata %}<div class="hata" role="alert">{{ hata }}</div>{% endif %}
    <form method="post" action="/veli-giris">
      <label for="telefon">Okula kayıtlı cep telefonunuz</label>
      <input id="telefon" name="telefon" type="tel" inputmode="tel" autocomplete="tel" required value="{{ telefon or '' }}" placeholder="05xx xxx xx xx">
      <div class="tuslar"><button class="tus tam">Kod gönder</button></div>
    </form>
  </div>
  <p class="kucuk soluk"><a href="/kvkk">Kişisel verilerin korunması hakkında</a></p>
</div>
{% endblock %}
