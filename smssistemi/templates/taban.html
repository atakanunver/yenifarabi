<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block baslik_etiketi %}SMS Sistemi{% endblock %}</title>
<link rel="stylesheet" href="/static/stil.css">
</head>
<body>
{% include "_ikon_sprite.html" %}
<header class="ust-cubuk">
  <a href="/" class="marka"><svg class="ikon"><use href="#ik-zarf"/></svg> SMS Sistemi</a>
  <nav>
    <a href="/" class="{{ 'aktif' if request.url.path == '/' else '' }}"><svg class="ikon"><use href="#ik-gonder"/></svg> Gönder</a>
    <a href="/rehber" class="{{ 'aktif' if request.url.path == '/rehber' else '' }}"><svg class="ikon"><use href="#ik-kullanicilar"/></svg> Rehber</a>
    <a href="/kayitlar" class="{{ 'aktif' if request.url.path == '/kayitlar' else '' }}"><svg class="ikon"><use href="#ik-saat"/></svg> Kayıtlar</a>
  </nav>
  <form method="post" action="/cikis" class="cikis-form">
    <button type="submit"><svg class="ikon"><use href="#ik-cikis"/></svg> Çıkış</button>
  </form>
</header>
<main>
{% block icerik %}{% endblock %}
</main>
</body>
</html>
