# /etc/systemd/system/open-webui.service.d/farabi-tema.conf
# Kaynak: /home/ata/farabi/webui-tema/farabi-tema.conf (kur.sh kurar)
# pip upgrade frontend/static'i ezerse her açılışta Farabi temasını
# (custom.css + ikonlar, webui-tema/static/*) geri yükler.
# "+" = root olarak çalış (servis openwebui kullanıcısı).
# "-" = kopyalama başarısız olsa da servis açılsın (tema yüzünden WebUI düşmesin).
[Service]
ExecStartPre=-+/bin/sh -c 'install -m 644 -o openwebui -g openwebui /home/ata/farabi/webui-tema/static/* /opt/open-webui/venv/lib/python3.12/site-packages/open_webui/frontend/static/'
